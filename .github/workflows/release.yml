name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: rdr2-xbox-save-converter-macos-arm64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: rdr2-xbox-save-converter-macos-x64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: rdr2-xbox-save-converter-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust and target
        shell: bash
        run: rustup default stable && rustup target add "${{ matrix.target }}"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: chmod +x scripts/package-macos.sh && scripts/package-macos.sh "${{ matrix.target }}" "${{ matrix.archive }}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Target "${{ matrix.target }}" -ArchiveName "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "RDR2 Xbox Save Converter ${GITHUB_REF_NAME}"
